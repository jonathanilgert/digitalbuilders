name: Deploy Digital Builders to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalbuilders-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify export artifact
        run: |
          test -f out/index.html
          test -f out/about/index.html
          test -f out/services/index.html
          test -f out/work/index.html
          test -f out/contact/index.html

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DB_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DB_DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/digitalbuilders_deploy
          chmod 600 ~/.ssh/digitalbuilders_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release and switch current symlink
        env:
          DEPLOY_HOST: ${{ secrets.DB_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DB_DEPLOY_USER }}
        run: |
          set -euo pipefail
          release="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          remote_root="/var/www/digitalbuilders.ca"
          ssh_cmd="ssh -i ~/.ssh/digitalbuilders_deploy -o BatchMode=yes ${DEPLOY_USER}@${DEPLOY_HOST}"
          tar -C out -czf /tmp/digitalbuilders-site.tgz .
          $ssh_cmd "mkdir -p ${remote_root}/releases/${release}"
          scp -i ~/.ssh/digitalbuilders_deploy -o BatchMode=yes /tmp/digitalbuilders-site.tgz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/digitalbuilders-site.tgz"
          $ssh_cmd "tar -xzf /tmp/digitalbuilders-site.tgz -C ${remote_root}/releases/${release} && rm /tmp/digitalbuilders-site.tgz && test -f ${remote_root}/releases/${release}/index.html && chown -R www-data:www-data ${remote_root}/releases/${release} && ln -sfn ${remote_root}/releases/${release} ${remote_root}/current.new && mv -Tf ${remote_root}/current.new ${remote_root}/current && nginx -t && systemctl reload nginx && readlink -f ${remote_root}/current"

      - name: Smoke test live site
        run: |
          set -euo pipefail
          for path in / /about/ /services/ /work/ /contact/; do
            curl --fail --silent --show-error --location --max-time 20 "https://digitalbuilders.ca${path}" > /tmp/db-page.html
            grep -qi "Digital Builders" /tmp/db-page.html
          done
          curl --fail --silent --show-error --location --max-time 20 "https://digitalbuilders.ca/app/" >/dev/null
